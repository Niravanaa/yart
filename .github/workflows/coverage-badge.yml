name: Update Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  COVERAGE_GIST_ID: 6e70009da55347696b1d22d1b35225d3

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run tests and coverage report
        run: ./gradlew --no-daemon test jacocoTestReport

      - name: Compute coverage badge values
        id: coverage
        shell: bash
        run: |
          set -euo pipefail
          ratio=$(python -c "import xml.etree.ElementTree as ET; root = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot(); c = next(x for x in root.findall('counter') if x.attrib.get('type') == 'LINE'); covered = int(c.attrib['covered']); missed = int(c.attrib['missed']); total = covered + missed; print(f'{(covered / total * 100.0) if total else 0.0:.2f}')")
          echo "ratio=$ratio" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge gist
        shell: bash
        run: |
          set -euo pipefail
          ratio='${{ steps.coverage.outputs.ratio }}'
          color=$(python -c "ratio = float('${{ steps.coverage.outputs.ratio }}'); print('brightgreen' if ratio >= 90 else 'green' if ratio >= 80 else 'yellowgreen' if ratio >= 70 else 'yellow' if ratio >= 60 else 'red')")
          badge_json=$(cat <<JSON
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${ratio}%",
            "color": "${color}"
          }
JSON
)
          payload=$(jq -n --arg content "$badge_json" '{files: {"coverage.json": {content: $content}}}')
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GIST_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/gists/${{ env.COVERAGE_GIST_ID }} \
            -d "$payload" > /dev/null
